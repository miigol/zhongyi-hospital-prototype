<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中医院获客合作 — 后台管理系统原型</title>
<style>
:root{--bg:#f0f2f5;--sidebar-bg:#1e293b;--sidebar-active:#2563eb;--card-bg:#fff;--text:#1e293b;--text-2:#64748b;--text-3:#94a3b8;--border:#e2e8f0;--primary:#2563eb;--primary-light:#dbeafe;--success:#059669;--success-light:#d1fae5;--warning:#d97706;--warning-light:#fef3c7;--danger:#dc2626;--danger-light:#fee2e2;--purple:#7c3aed;--purple-light:#ede9fe;--teal:#0d9488;--teal-light:#ccfbf1;--shadow:0 1px 3px rgba(0,0,0,.06);--radius:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--sidebar-bg);color:#cbd5e1;flex-shrink:0;position:fixed;height:100vh;overflow-y:auto;z-index:50}
.sidebar-header{padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-header h2{font-size:16px;color:#fff;font-weight:600}
.sidebar-header p{font-size:11px;color:#64748b;margin-top:4px}
.sidebar-nav{padding:8px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;font-size:13px;color:#94a3b8;cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.05);color:#e2e8f0}
.nav-item.active{background:rgba(37,99,235,.15);color:#fff;border-left-color:var(--sidebar-active)}
.nav-item .nav-icon{font-size:16px;width:20px;text-align:center}
.nav-section-title{font-size:11px;color:#475569;text-transform:uppercase;padding:16px 20px 6px;letter-spacing:1px}
.main{flex:1;margin-left:220px}
.topbar{height:56px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:40}
.topbar-left{display:flex;align-items:center;gap:16px}
.topbar-left h1{font-size:16px;font-weight:600}
.topbar-right{display:flex;align-items:center;gap:16px}
.topbar-right select{padding:6px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;cursor:pointer}
.topbar-right .user-info{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.content{padding:24px}
.page{display:none}
.page.active{display:block}
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-header h3{font-size:15px;font-weight:600}
.card-body{padding:20px}
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:24px}
.kpi-card{background:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);position:relative;cursor:pointer;transition:transform .15s,box-shadow .15s}
.kpi-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.kpi-card .label{font-size:12px;color:var(--text-3);margin-bottom:8px}
.kpi-card .value{font-size:28px;font-weight:700;line-height:1.2}
.kpi-card .unit{font-size:14px;font-weight:400;color:var(--text-2)}
.kpi-card .trend{font-size:12px;margin-top:8px;display:flex;align-items:center;gap:4px}
.kpi-card .trend.up{color:var(--success)}
.kpi-card .trend.down{color:var(--danger)}
.kpi-card .icon-bg{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px}
.funnel{display:flex;flex-direction:column;gap:4px}
.funnel-step{display:flex;align-items:center;padding:12px 16px;border-radius:6px;position:relative;overflow:hidden;cursor:pointer;transition:opacity .15s}
.funnel-step:hover{opacity:.85}
.funnel-step .step-label{font-size:13px;font-weight:500;z-index:2;white-space:nowrap;color:#fff}
.funnel-step .step-count{margin-left:auto;font-weight:700;z-index:2;color:#fff}
.funnel-step .step-rate{font-size:12px;color:#fff;opacity:.8;margin-left:12px;z-index:2}
.funnel-bar{position:absolute;left:0;top:0;bottom:0;border-radius:6px;opacity:.25}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;padding:10px 14px;background:#f8fafc;border-bottom:1px solid var(--border);font-weight:600;color:var(--text-2);white-space:nowrap;font-size:12px}
.table td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tbody tr{cursor:pointer;transition:background .1s}
.table tbody tr:hover{background:#f1f5f9}
.status{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:4px;font-weight:500}
.status-active{background:var(--success-light);color:var(--success)}
.status-pending{background:var(--warning-light);color:var(--warning)}
.status-inactive{background:#f1f5f9;color:var(--text-3)}
.status-danger{background:var(--danger-light);color:var(--danger)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500}
.tag-blue{background:var(--primary-light);color:var(--primary)}
.tag-green{background:var(--success-light);color:var(--success)}
.tag-orange{background:var(--warning-light);color:var(--warning)}
.tag-purple{background:var(--purple-light);color:var(--purple)}
.tag-teal{background:var(--teal-light);color:var(--teal)}
.tag-red{background:var(--danger-light);color:var(--danger)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;font-size:13px;font-weight:500;border-radius:6px;border:none;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:#1d4ed8}
.btn-outline{background:#fff;border:1px solid var(--border);color:var(--text-2)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:4px 10px;font-size:12px}
.journey-track{display:flex;align-items:center;gap:0;overflow-x:auto;padding:20px 0}
.journey-node{display:flex;flex-direction:column;align-items:center;min-width:100px;position:relative;cursor:pointer}
.journey-node:hover .node-circle{transform:scale(1.1);transition:transform .15s}
.journey-node .node-circle{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;z-index:2}
.journey-node .node-label{font-size:11px;color:var(--text-2);margin-top:8px;text-align:center;white-space:nowrap}
.journey-node .node-count{font-size:13px;font-weight:600;margin-top:2px}
.journey-line{flex:1;height:2px;background:var(--border);min-width:30px}
.journey-line.active{background:var(--primary)}
.progress-bar{height:6px;background:#f1f5f9;border-radius:3px;overflow:hidden;width:100%}
.progress-fill{height:100%;border-radius:3px}
.filter-bar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.filter-bar select,.filter-bar input{padding:7px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;color:var(--text);cursor:pointer}
.filter-bar select:focus,.filter-bar input:focus{outline:none;border-color:var(--primary)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{padding:10px 20px;font-size:13px;font-weight:500;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:var(--primary)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab-content{display:none}
.tab-content.active{display:block}
.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.role-card{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border-left:4px solid var(--primary);cursor:pointer;transition:transform .15s,box-shadow .15s}
.role-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.role-card h4{font-size:14px;margin-bottom:4px}
.role-card .role-perm{font-size:12px;color:var(--text-3);margin-bottom:8px}
.role-card .role-actions{font-size:12px;color:var(--text-2);line-height:1.8}
.chart-bar-container{display:flex;align-items:flex-end;gap:12px;height:160px;padding:12px 0}
.chart-bar-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.chart-bar-item:hover .chart-bar{opacity:.8}
.chart-bar{width:100%;max-width:40px;border-radius:4px 4px 0 0;transition:height .3s;position:relative}
.chart-bar-label{font-size:11px;color:var(--text-3)}
.gate-status{display:flex;align-items:center;gap:8px}
.gate-dot{width:8px;height:8px;border-radius:50%}
.gate-dot.pass{background:var(--success)}.gate-dot.fail{background:var(--danger)}.gate-dot.pending{background:var(--warning)}.gate-dot.blocked{background:var(--text-3)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.text-muted{color:var(--text-3);font-size:12px}
.text-success{color:var(--success)}.text-danger{color:var(--danger)}.text-warning{color:var(--warning)}
.fw-600{font-weight:600}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:40px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;width:100%;max-width:760px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:5;border-radius:12px 12px 0 0}
.modal-header h3{font-size:17px;font-weight:600}
.modal-close{width:32px;height:32px;border-radius:6px;border:none;background:#f1f5f9;color:var(--text-2);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--danger-light);color:var(--danger)}
.modal-body{padding:24px}
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--border)}
.timeline-item{position:relative;padding-bottom:20px}
.timeline-item:last-child{padding-bottom:0}
.timeline-item .tl-dot{position:absolute;left:-24px;top:2px;width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--border)}
.timeline-item.done .tl-dot{background:var(--success)}
.timeline-item.current .tl-dot{background:var(--warning)}
.timeline-item.pending .tl-dot{background:#fff;border-color:var(--border)}
.timeline-item .tl-time{font-size:11px;color:var(--text-3);margin-bottom:2px}
.timeline-item .tl-title{font-size:13px;font-weight:600;margin-bottom:4px}
.timeline-item .tl-desc{font-size:12px;color:var(--text-2);line-height:1.5}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--sidebar-bg);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:200;transition:transform .3s;box-shadow:0 4px 16px rgba(0,0,0,.2);white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.detail-section{margin-bottom:20px}
.detail-section h4{font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}
.detail-grid .dg-item{display:flex;flex-direction:column;gap:2px}
.detail-grid .dg-label{font-size:11px;color:var(--text-3)}
.detail-grid .dg-value{font-size:14px;font-weight:500}
.empty-row{text-align:center;padding:40px;color:var(--text-3);font-size:13px}
</style>
</head>
